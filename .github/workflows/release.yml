# 打 v* tag 时出全平台单二进制,挂到 GitHub Releases。
# npm 发布仍是手动 `npm publish`(prepublishOnly 把关),两条分发线互不影响。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - run: npm run build
      # 交叉编译全 6 平台 + tar.gz/zip 归档 + SHA256SUMS(install.sh 靠它校验)。
      - run: bun scripts/build-binaries.ts
      - name: sanity check linux binary
        run: |
          set -eux
          tar -xzf dist/bin/mojocode-linux-x64.tar.gz -C /tmp
          version="$(/tmp/mojocode --version)"
          test "$version" = "$(node -p "require('./package.json').version")"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/bin/*.tar.gz
            dist/bin/*.zip
            dist/bin/SHA256SUMS
